[project]
name = "tally"
version = "0.3.0"
description = "Keep a running tally of named counters in a JSON file"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tally = "tally.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
