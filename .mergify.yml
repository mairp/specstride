# Mergify merges PRs into main once CI is green.
# Opt out of auto-merge on a PR by labelling it `do-not-merge`.
# Head branches are deleted by GitHub's "automatically delete head branches"
# repo setting; main's branch protection requires lint + test.
merge_protections_settings:
  auto_merge_conditions:
    - base = main
    - -draft
    - label != do-not-merge

queue_rules:
  - name: default
    queue_conditions:
      - base = main
      - -draft
      - -conflict
      - label != do-not-merge
      - check-success = lint
      - check-success = test
      # No AI-assistant session or conversation may be exposed (.github/workflows/no-session-links.yml):
      # the status covers files, commit messages and the whole PR conversation; title and body are
      # also refused here directly.
      - check-success = no-session-links
      - -title ~= (?i)claude[.]ai
      - -body ~= (?i)claude[.]ai
    merge_conditions:
      - check-success = no-session-links
      - -title ~= (?i)claude[.]ai
      - -body ~= (?i)claude[.]ai
      - check-success = lint
      - check-success = test
    merge_method: squash
