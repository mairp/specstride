# Mergify merges PRs into main once CI is green.
# Opt out of auto-merge on a PR by labelling it `do-not-merge`.
queue_rules:
  - name: default
    queue_conditions:
      - base=main
      - -draft
      - -conflict
      - label!=do-not-merge
      - check-success=lint
      - check-success=test
    merge_conditions:
      - check-success=lint
      - check-success=test
    merge_method: squash

pull_request_rules:
  - name: queue green PRs to main
    conditions:
      - base=main
      - -draft
      - label!=do-not-merge
    actions:
      queue:
        name: default

