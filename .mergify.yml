# Mergify merges PRs into main once CI is green.
# Opt out of auto-merge on a PR by labelling it `do-not-merge`.
# Head branches are deleted by GitHub's "automatically delete head branches"
# repo setting; main's branch protection requires lint + test.
merge_protections_settings:
  auto_merge_conditions:
    - base = main
    - -draft
    - label != do-not-merge

queue_rules:
  - name: default
    queue_conditions:
      - base = main
      - -draft
      - -conflict
      - label != do-not-merge
      - check-success = lint
      - check-success = test
    merge_conditions:
      - check-success = lint
      - check-success = test
    merge_method: squash
